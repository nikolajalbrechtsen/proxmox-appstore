<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxmox App Store</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e57000'/><path d='M9 12h14l-1.5 11h-11zM12 12a4 4 0 0 1 8 0' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--panel2:#f0f1f4;--line:#e1e3e8;--text:#1a1d23;--muted:#6b7280;
  --accent:#e57000;--accent-text:#fff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--panel:#181b21;--panel2:#20242c;--line:#2a2f39;--text:#e8eaee;--muted:#8b93a1;
  --accent:#ff8a1f;--accent-text:#1a1000;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:auto;padding:0 16px;display:flex;align-items:center;gap:20px;height:56px}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-text);font-style:normal;font-size:15px}
nav{display:flex;gap:4px;height:100%}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:0 12px;cursor:pointer;color:var(--muted);font-weight:600}
nav button.on{color:var(--text);border-color:var(--accent)}
.badge{background:var(--accent);color:var(--accent-text);border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px}
.spacer{flex:1}
main{max-width:1200px;margin:auto;padding:20px 16px 60px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat,.card,.app{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.stat{padding:14px 16px}
.stat .k{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:20px;font-weight:700;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500}
.meter{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.meter b{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.meter b.hot{background:var(--bad)}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tools input,.tools select,.field input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:0}
.tools input{flex:1;min-width:160px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.off{opacity:.75}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.ico{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--muted);flex:none;overflow:hidden}
.ico img{width:28px;height:28px;object-fit:contain}
.name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.dot:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.running{color:var(--ok)}.dot.running:before{background:var(--ok)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:12px;color:var(--muted)}
.mini span{display:flex;justify-content:space-between;margin-bottom:3px;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:var(--panel2);border-radius:5px;padding:1px 7px;font-size:11.5px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.app{padding:16px;display:flex;flex-direction:column;gap:10px}
.app p{margin:0;color:var(--muted);font-size:13px;flex:1}
.app .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.app.custom{border-style:dashed}
.empty{color:var(--muted);text-align:center;padding:50px 0;grid-column:1/-1}
.group{grid-column:1/-1;margin:10px 0 0;font-size:15px}
.group:first-child{margin-top:0}
.group small{color:var(--muted);font-weight:500}
.job{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.job .st{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.job.failed .st{color:var(--bad)}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.mark{width:18px;text-align:center;font-weight:700;flex:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:18px}
.modal p{color:var(--muted);margin:4px 0 14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input{width:100%}
.field textarea,.field select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;width:100%;font:inherit;color:inherit}
.field textarea{min-height:70px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
details.adv{border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:12px}
details.adv summary{cursor:pointer;font-weight:600;padding:10px 0;user-select:none}
details.adv[open] summary{margin-bottom:6px}
.app.click{cursor:pointer;transition:border-color .15s}
.app.click:hover,.app.click:focus-visible{border-color:var(--accent);outline:none}
.modal.wide{max-width:760px}
.shot{display:block;width:100%;max-height:400px;object-fit:contain;background:var(--panel2);border-radius:10px}
.thumbs{display:flex;gap:8px;margin:8px 0 0;overflow-x:auto}
.thumb{flex:none;padding:0;border:2px solid transparent;border-radius:8px;background:var(--panel2);cursor:pointer;overflow:hidden;height:58px}
.thumb.on{border-color:var(--accent)}
.thumb img{height:100%;width:90px;object-fit:cover;display:block}
.info{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:14px 0;font-size:13px}
.info dt{color:var(--muted);font-weight:600}
.info dd{margin:0;overflow-wrap:anywhere}
.info code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.modal a{color:var(--accent)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.end{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.mhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mhead .name{font-size:18px}
.mhead .actions{margin:0}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.subtabs button.on{color:var(--text);border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;max-width:760px}
.panel h3{margin:20px 0 10px;font-size:14px}
.panel h3:first-child{margin-top:0}
.panel p{color:var(--muted);margin:0 0 12px;font-size:13px}
.panel .info{margin-top:0}
@media (max-width:560px){.three{grid-template-columns:1fr 1fr}}
.frow{display:flex;align-items:center;gap:10px;padding:6px 2px;border-top:1px solid var(--line);min-width:0}
.fico{width:14px;flex:none;color:var(--muted);text-align:center}
.flink{background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.flink:hover{color:var(--accent)}
.fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fmeta{color:var(--muted);font-size:12.5px;white-space:nowrap;flex:none;max-width:30%;overflow:hidden;text-overflow:ellipsis}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.crumbs .flink{flex:none;max-width:100%}
#fedit{display:block;width:100%;height:60vh;min-height:240px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12.5px/1.5 ui-monospace,Consolas,monospace;tab-size:4;white-space:pre;overflow:auto}
@media (max-width:700px){.fhide{display:none}}
.app p.notes{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.app a.name{color:inherit;text-decoration:none;display:block}
.app a.name:hover{text-decoration:underline}
.modal h3{margin:12px 0 6px;font-size:14px}
.modal .rel{box-shadow:none;padding:0;border:0;margin-bottom:14px}
nav{min-width:0;overflow-x:auto}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:4px 0}
pre{background:var(--panel2);border-radius:8px;padding:10px;font-size:11.5px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0 0 12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;z-index:30;max-width:90vw}
@media (max-width:560px){.bar{gap:10px}.logo span{display:none}.grid{grid-template-columns:1fr}}
#releases{max-width:760px}
.rel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.relhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.relhead h2{margin:0;font-size:16px}
.relhead .sub{margin-left:auto}
.tag.latest{background:var(--accent);color:var(--accent-text);font-weight:600}
.rel ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rel li{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline}
.kind{font-size:11.5px;font-weight:700;text-align:center;border-radius:5px;padding:2px 0;background:var(--panel2);color:var(--muted)}
.kind.new{color:var(--ok)}
.kind.fixed{color:var(--warn)}
@media (max-width:560px){nav button{padding:0 8px}}
/* Game servers: console, players, plugins. The console is dark in both themes, like a terminal. */
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 10px;font-size:12.5px;color:var(--muted);font-weight:600}
.chip code{font:12.5px ui-monospace,Consolas,monospace;color:var(--text);font-weight:400}
.gwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.gwrap .panel{max-width:none;min-width:0}
.con{flex:999 1 520px;min-width:0;background:#0f1115;color:#dfe3ea;border:1px solid #2a2f39;border-radius:12px;overflow:hidden}
.conbar,.cin{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12.5px;color:#a3abb8}
.conbar{border-bottom:1px solid #2a2f39;flex-wrap:wrap}
.conbar label{display:inline-flex;align-items:center;gap:6px}
.conbar input{accent-color:#ff8a1f}
.conbar .live{color:#34d399;font-weight:600}
.conbar .bad{color:#fbbf24}
.con .btn{background:#20242c;border-color:#2a2f39;color:#e8eaee}
.con .btn.primary{background:#ff8a1f;border-color:#ff8a1f;color:#1a1000}
.clog{height:calc(100vh - 430px);min-height:260px;overflow:auto;padding:10px 14px;font:12.5px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.clog:focus-visible{outline:2px solid #ff8a1f;outline-offset:-2px}
.clog .w{color:#fbbf24}.clog .e{color:#f87171}.clog .j{color:#34d399}.clog .c{color:#ff8a1f}.clog .n{color:#8b93a1}
.cin{border-top:1px solid #2a2f39}
.cin:focus-within{outline:2px solid #ff8a1f;outline-offset:-2px}
.cin b{color:#ff8a1f;font:700 14px ui-monospace,Consolas,monospace}
.cin input{flex:1;min-width:0;background:none;border:0;outline:0;color:#e8eaee;font:13px ui-monospace,Consolas,monospace;padding:6px 0}
.cin input::placeholder{color:#8b93a1}
.side{flex:1 1 280px;min-width:0;padding:0;gap:0}
.prow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);min-width:0}
.prow:first-child{border-top:0;padding-top:13px}
.prow .ico{width:30px;height:30px;border-radius:7px;font-size:14px}
.pnote{color:var(--muted);font-size:13px}
.pmenu{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 16px 12px}
.pmenu select{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-width:0}
.pfoot{flex-wrap:wrap;gap:6px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.hico{width:34px;height:34px;border-radius:8px;background:var(--panel2);flex:none;object-fit:cover}
.hdesc{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-size:12.5px;font-weight:600}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-weight:600;font-size:12.5px;cursor:pointer}
.pill:hover{border-color:var(--muted)}
.gform{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.gform .wide,.gform .check{grid-column:1/-1}
.gform small{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<header class="hidden" id="hdr"><div class="bar">
  <div class="logo"><i>▣</i><span>Proxmox App Store</span></div>
  <nav>
    <button data-tab="overview" class="on">My apps</button>
    <button data-tab="store">Store</button>
    <button data-tab="shortcuts">Shortcuts</button>
    <button data-tab="activity">Activity<span class="badge hidden" id="jobBadge"></span></button>
    <button data-tab="changelog">Changelog</button>
  </nav>
  <div class="spacer"></div>
  <button class="btn sm primary hidden" id="updateBtn">Update</button>
  <button class="btn sm" id="logout">Sign out</button>
</div></header>

<main>
  <section id="overview" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input id="gq" type="search" placeholder="Search apps and containers…" aria-label="Search">
      <select id="gf" aria-label="Filter"><option value="">All</option><option value="running">Running</option><option value="stopped">Stopped</option><option value="lxc">Containers</option><option value="qemu">Virtual machines</option></select>
    </div>
    <div class="grid" id="guests"></div>
  </section>
  <section id="manage" class="hidden">
    <div class="mhead" id="mhead"></div>
    <div class="stats" id="mstats"></div>
    <div class="subtabs" id="mtabs"></div>
    <div id="mbody"></div>
  </section>
  <section id="store" class="hidden">
    <div class="tools">
      <input id="sq" type="search" placeholder="Search the store…" aria-label="Search the store">
      <select id="sc" aria-label="Category"></select>
    </div>
    <div class="grid" id="apps"></div>
  </section>
  <section id="shortcuts" class="hidden">
    <div class="tools">
      <input id="lq" type="search" placeholder="Search shortcuts…" aria-label="Search shortcuts">
      <button class="btn primary" id="addLink">Add shortcut</button>
    </div>
    <div class="grid" id="links"></div>
  </section>
  <section id="activity" class="hidden"><div id="jobs"></div></section>
  <section id="changelog" class="hidden"><div id="releases"></div></section>
</main>
<div id="modal"></div>
<div id="toast" class="hidden" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS = 'https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/';
let state = {}, data = null, catalog = [], jobs = [], tab = 'overview', busy = {};

async function api(path, body) {
  const r = await fetch('/api/' + path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== 'login') { if (state.authed) location.reload(); throw new Error(j.error || 'Not signed in'); }
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 4500); }
const bytes = b => { if (!b) return '0'; const u = ['B','KB','MB','GB','TB']; const i = Math.min(4, Math.floor(Math.log(b) / Math.log(1024))); return (b / 1024 ** i).toFixed(i > 2 ? 1 : 0) + ' ' + u[i]; };
const upt = s => s > 86400 ? Math.floor(s / 86400) + 'd ' + Math.floor(s % 86400 / 3600) + 'h' : s > 3600 ? Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm' : Math.floor(s / 60) + 'm';
// Replaces {{hex16}} / {{hex64}} in catalog defaults with a random value of that length.
const fill = s => String(s ?? '').replace(/\{\{hex(\d+)\}\}/g, (_, n) => [...crypto.getRandomValues(new Uint8Array(n / 2))].map(b => b.toString(16).padStart(2, '0')).join(''));
const pct = (a, b) => b ? Math.min(100, a / b * 100) : 0;
const meter = p => `<div class="meter"><b class="${p > 90 ? 'hot' : ''}" style="width:${p.toFixed(1)}%"></b></div>`;
const icon = (slug, name) => `<div class="ico">${slug ? `<img src="${ICONS}${esc(slug)}.svg" alt="" loading="lazy" onerror="this.replaceWith('${esc(name[0] || '?').toUpperCase()}')">` : esc(name[0] || '?').toUpperCase()}</div>`;

// ---------- modal helpers ----------
function modal(html, onSubmit, dismissable = true, cls = '') {
  $('#modal').innerHTML = `<div class="overlay"><form class="modal ${cls}" role="dialog" aria-modal="true">${html}</form></div>`;
  const f = $('#modal form');
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('[type=submit]'), err = f.querySelector('.err');
    btn.disabled = true; if (err) err.textContent = '';
    try { await onSubmit(Object.fromEntries(new FormData(f)), f); }
    catch (x) { if (err) err.textContent = x.message; else toast(x.message); btn.disabled = false; }
  };
  if (dismissable) {
    $('#modal .overlay').onmousedown = e => { if (e.target.classList.contains('overlay')) closeModal(); };
    f.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  }
  (f.querySelector('[autofocus]') || f.querySelector('input'))?.focus();
}
const closeModal = () => $('#modal').innerHTML = '';
// The page is served over plain HTTP, where the clipboard API is not available, so copy through a selection.
function copyText(text, done) {
  const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0'; document.body.append(t); t.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  t.remove(); toast(ok ? done : 'Could not copy. Select the text and copy it yourself.');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.authed) closeModal(); });

// ---------- setup & login ----------
function showSetup() {
  // Installed with install.sh: the connection to Proxmox is already prepared, only the password is missing.
  if (state.preseeded) return modal(`<h2>Welcome to App Store</h2>
    <p>The installer has already connected it to Proxmox. Choose a password to finish. You sign in to the App Store with it.</p>
    <div class="field"><label>Password</label><input name="password" type="password" minlength="8" required autocomplete="new-password" autofocus></div>
    <div class="err"></div>
    <div class="end"><button class="btn primary" type="submit">Finish</button></div>`,
    async v => { await api('setup', v); location.reload(); }, false);
  modal(`<h2>Welcome to App Store</h2>
    <p>Connect it to Proxmox with an API token. Run this once in the Proxmox host shell (Datacenter → pve → Shell), then paste the result below.</p>
    <pre>pveum role add AppStore -privs "VM.Allocate,VM.Audit,VM.PowerMgmt,VM.Config.Disk,VM.Config.CPU,VM.Config.Memory,VM.Config.Network,VM.Config.Options,VM.GuestAgent.Audit,Datastore.AllocateSpace,Datastore.AllocateTemplate,Datastore.Audit,Sys.Audit,Sys.AccessNetwork,SDN.Use"
pveum user add appstore@pve
pveum acl modify / -user appstore@pve -role AppStore
pveum user token add appstore@pve web --privsep 0</pre>
    <div class="field"><label>Proxmox host</label><input name="host" placeholder="IP address of your Proxmox host" required></div>
    <div class="field"><label>Token ID</label><input name="tokenId" value="appstore@pve!web" required autocomplete="off"></div>
    <div class="field"><label>Token secret (the "value" printed by the last command)</label><input name="secret" ${state.dev ? '' : 'required'} autocomplete="off" autofocus></div>
    <div class="field"><label>Choose a password for this App Store</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div>
    <div class="err"></div>
    <div class="end"><button class="btn primary" type="submit">Connect</button></div>`,
    async v => { await api('setup', v); location.reload(); }, false);
}
function showLogin() {
  modal(`<h2>App Store</h2><p>Sign in to manage your apps.</p>
    <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password" autofocus></div>
    <div class="err"></div><div class="end"><button class="btn primary" type="submit">Sign in</button></div>`,
    async v => { await api('login', v); location.reload(); }, false);

// ---------- overview ----------
const catOf = g => catalog.find(a => a.id === g.app) || catalog.find(a => g.name.includes(a.id));
const guestIcon = g => { const c = catOf(g); return icon(c ? c.icon : g.name.replace(/[^a-z0-9-]/g, ''), g.name); };
const guestState = g => busy[g.vmid] ? '<div class="spin"></div>' : `<span class="dot ${esc(g.status)}">${g.status === 'running' ? 'Running' : 'Stopped'}</span>`;
// Open / Start / Restart / Stop / Delete buttons, shared by the cards and the Manage page.
function guestButtons(g, manage, kill) {
  const on = g.status === 'running';
  const a = (act, label, cls = '') => `<button class="btn sm ${cls}" data-act="${act}" data-id="${g.vmid}" ${busy[g.vmid] || (g.self && act !== 'start' && act !== 'manage') ? 'disabled' : ''}>${label}</button>`;
  return (g.url && on ? `<a class="btn sm primary" href="${esc(g.url)}" target="_blank" rel="noopener">Open</a>` : '')
    + (on ? a('reboot', 'Restart') + a('shutdown', 'Stop') + (kill ? a('stop', 'Kill', 'danger') : '') : a('start', 'Start')) + (manage ? a('manage', 'Manage') : '') + (on ? '' : a('delete', 'Delete', 'danger'));
}
function renderOverview() {
  if (!data) return;
  const h = data.host, st = data.storages;
  const run = data.guests.filter(g => g.status === 'running').length;
  $('#stats').innerHTML = [
    ['Apps/VMs running', `${run} <small>of ${data.guests.length}</small>`, pct(run, data.guests.length)],
    ['Host CPU', `${(h.cpu * 100).toFixed(0)}% <small>of ${h.maxcpu} cores</small>`, h.cpu * 100],
    ['Host memory', `${bytes(h.mem)} <small>of ${bytes(h.maxmem)}</small>`, pct(h.mem, h.maxmem)],
    ...st.map(s => [`Storage · ${esc(s.name)}`, `${bytes(s.used)} <small>of ${bytes(s.total)}</small>`, pct(s.used, s.total)]),
  ].map(([k, v, p]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${meter(p)}</div>`).join('');

  const q = $('#gq').value.toLowerCase(), f = $('#gf').value;
  const list = data.guests.filter(g => (!q || [g.name, g.vmid, g.ip, ...g.tags].join(' ').toLowerCase().includes(q)) && (!f || g.status === f || g.type === f));
  const card = g => {
    const on = g.status === 'running';
    return `<div class="card ${on ? '' : 'off'}">
      <div class="row">${guestIcon(g)}
        <div class="grow"><div class="name">${esc(g.name)}</div>
          <div class="sub">${g.type === 'lxc' ? 'Container' : 'VM'} ${g.vmid}${g.ip ? ' · ' + esc(g.ip) : ''}${on ? ' · up ' + upt(g.uptime) : ''}</div></div>
        ${guestState(g)}
      </div>
      <div class="mini">
        <div><span><b>CPU</b>${on ? (g.cpu * 100).toFixed(1) + '%' : '–'} · ${g.maxcpu} core${g.maxcpu > 1 ? 's' : ''}</span>${meter(on ? g.cpu * 100 : 0)}</div>
        <div><span><b>Memory</b>${on ? bytes(g.mem) + ' / ' : ''}${bytes(g.maxmem)}</span>${meter(on ? pct(g.mem, g.maxmem) : 0)}</div>
      </div>
      ${g.tags.length || g.self ? `<div class="tags">${g.self ? '<span class="tag">this app store</span>' : ''}${g.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="actions">${guestButtons(g, true)}</div></div>`;
  };
  // Apps (containers) first, then virtual machines, each under its own heading.
  const group = (title, items) => items.length ? `<h2 class="group">${title} <small>${items.length}</small></h2>` + items.map(card).join('') : '';
  $('#guests').innerHTML = group('Apps', list.filter(g => g.type === 'lxc')) + group('Virtual machines', list.filter(g => g.type === 'qemu'))
    || '<div class="empty">Nothing matches.</div>';
}
async function refresh() {
  try { data = await api('guests'); if (tab === 'overview') renderOverview(); if (tab === 'manage') renderManageHead(); } catch (e) { if (!data) toast(e.message); }
}
$('#guests').onclick = $('#mhead').onclick = e => {
  if (e.target.closest('[data-back]')) return show('overview');
  const cp = e.target.closest('[data-copy]');
  if (cp) return copyText(cp.dataset.copy, 'Address copied.');
  const b = e.target.closest('[data-act]'); if (!b) return;
  const g = data.guests.find(x => x.vmid == b.dataset.id), act = b.dataset.act;
  if (!g) return;
  if (act === 'start') return doAction(g, act);
  if (act === 'manage') return openManage(g);
  if (act === 'delete') return modal(`<h2>Delete ${esc(g.name)}?</h2>
    <p>This permanently destroys ${g.type === 'lxc' ? 'container' : 'virtual machine'} ${g.vmid} and all of its data. This cannot be undone.</p>
    <div class="field"><label>Type <b>${esc(g.name)}</b> to confirm</label><input name="c" autocomplete="off" autofocus></div><div class="err"></div>
    <div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn danger" type="submit">Delete forever</button></div>`,
    async v => { if (v.c !== g.name) throw new Error('The name does not match.'); closeModal(); doAction(g, 'delete'); });
  if (act === 'stop') return modal(`<h2>Kill ${esc(g.name)}?</h2><p>The server is switched off at once, without saving first. What happened since the last save can be lost. Use Stop unless the server hangs.</p>
    <div class="end"><button class="btn" type="button" data-close autofocus>Cancel</button><button class="btn danger" type="submit">Kill</button></div>`,
    async () => { closeModal(); doAction(g, 'stop'); });
  modal(`<h2>${act === 'reboot' ? 'Restart' : 'Stop'} ${esc(g.name)}?</h2><p>The app will be ${act === 'reboot' ? 'briefly unavailable' : 'unavailable until you start it again'}.</p>
    <div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit" autofocus>${act === 'reboot' ? 'Restart' : 'Stop'}</button></div>`,
    async () => { closeModal(); doAction(g, act); });
};
async function doAction(g, act) {
  busy[g.vmid] = 1; renderOverview(); if (tab === 'manage') renderManageHead();
  try { await api(`guests/${g.type}/${g.vmid}/${act}`, {}); toast(`${g.name}: ${{ start: 'started', shutdown: 'stopped', stop: 'stopped', reboot: 'restarted', delete: 'deleted' }[act]}`); }
  catch (e) { toast(e.message); }
  delete busy[g.vmid]; await refresh();
}
$('#gq').oninput = $('#gf').onchange = renderOverview;

// ---------- manage page ----------
// One installed app or VM: its settings, loaded from Proxmox when the page opens.
let mg = null;   // { type, vmid, tab, s: settings, err }
const mguest = () => mg && data && data.guests.find(x => x.vmid == mg.vmid && x.type === mg.type);
async function openManage(g) {
  const game = gameOf(g);
  mg = { type: g.type, vmid: g.vmid, tab: game ? 'console' : 'container', s: null, err: null,
    files: { path: game ? game.data : '/', entries: null, err: null, edit: null, status: null, checked: false },
    con: { pos: null, err: null, wait: 0, n: 0, busy: false, hist: [], hi: 0, players: null, perr: null, open: null, sig: '' },
    plug: { data: null, err: null, dirty: false, q: '', hits: null, herr: null, hn: 0 } };
  $('#mbody').innerHTML = '';
  show('manage');
  await loadManage();
}
async function loadManage() {
  const me = mg; if (!me) return;
  try { const s = await api(`guests/${me.type}/${me.vmid}/config`); me.s = s; me.err = null; }
  catch (e) { me.err = e.message; }
  if (mg === me && tab === 'manage') renderManageBody();
}
function renderManage() { renderManageHead(); renderManageBody(); }
// The header follows the live status; the form below is only redrawn on load, tab change and save, so typing is never lost.
function renderManageHead() {
  const g = mguest();
  if (!g) { mg = null; return show('overview'); }
  // Game servers have no web page to open, so the header shows the address players type into the game.
  const game = gameOf(g), addr = game && g.ip ? `${g.ip}:${envOf(game.portKey) || game.port}` : '';
  $('#mhead').innerHTML = `<button class="btn sm" type="button" data-back>← My apps</button>${guestIcon(g)}
    <div class="grow"><div class="name">${esc(g.name)}</div>
      <div class="sub">${g.type === 'lxc' ? 'Container' : 'VM'} ${g.vmid}${g.ip ? ' · ' + esc(g.ip) : ''}${g.status === 'running' ? ' · up ' + upt(g.uptime) : ''}</div></div>
    ${game && g.ip ? `<span class="chip">Connect to <code>${esc(addr)}</code><button class="btn sm" type="button" data-copy="${esc(addr)}">Copy</button></span>` : ''}
    ${guestState(g)}<div class="actions">${guestButtons(g, false, !!game)}</div>`;
  // What the app uses right now. Follows the same 5-second refresh as the header.
  const on = g.status === 'running', lxc = g.type === 'lxc', cores = `${g.maxcpu} core${g.maxcpu > 1 ? 's' : ''}`;
  const tile = (k, v, p) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${p == null ? '' : meter(p)}</div>`;
  $('#mstats').innerHTML = [
    tile('CPU', on ? `${(g.cpu * 100).toFixed(1)}% <small>of ${cores}</small>` : `– <small>${cores}</small>`, on ? g.cpu * 100 : 0),
    tile('Memory', on ? `${bytes(g.mem)} <small>of ${bytes(g.maxmem)}</small>` : `– <small>${bytes(g.maxmem)}</small>`, on ? pct(g.mem, g.maxmem) : 0),
    g.maxdisk ? tile('Disk', lxc ? `${bytes(g.disk)} <small>of ${bytes(g.maxdisk)}</small>` : bytes(g.maxdisk), lxc ? pct(g.disk, g.maxdisk) : null) : '',
    tile('Network since start', on ? `↓ ${bytes(g.netin)} <small>↑ ${bytes(g.netout)}</small>` : '–', null),
  ].join('');
}
function renderManageBody() {
  const g = mguest(); if (!g) return;
  const lxc = g.type === 'lxc', s = mg.s, game = gameOf(g);
  const tabs = game ? [['console', 'Console'], ['plugins', plugWord()], ['files', 'Files'], ['game', 'Settings'], ['container', 'Container']]
    : [['container', lxc ? 'Container settings' : 'Settings'], ...(lxc ? [['files', 'Files'], ['app', 'App settings']] : [])];
  $('#mtabs').innerHTML = tabs.map(([k, l]) => `<button type="button" data-mtab="${k}" class="${mg.tab === k ? 'on' : ''}">${l}</button>`).join('');
  if (mg.tab === 'console') return renderConsole();
  if (mg.tab === 'plugins') return renderPlugins();
  if (mg.tab === 'files') return renderFiles();
  if (!s) { $('#mbody').innerHTML = `<div class="empty">${mg.err ? esc(mg.err) : 'Loading…'}</div>`; return; }
  $('#mbody').innerHTML = `<form class="panel">${mg.tab === 'app' ? appForm(g, s) : mg.tab === 'game' ? gameForm(g, s) : containerForm(g, s)}
    ${g.self ? '<p>This is the App Store itself. Change its settings in the Proxmox UI.</p>' : ''}
    <div class="err"></div><div class="end"><button class="btn primary" type="submit" ${g.self ? 'disabled' : ''}>Save</button></div></form>`;
  const f = $('#mbody form'), mode = f.elements.mode;
  if (mode) mode.onchange = () => $('#mStatic').classList.toggle('hidden', mode.value !== 'static');
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('[type=submit]'), err = f.querySelector('.err');
    btn.disabled = true; err.textContent = '';
    try { await (mg.tab === 'app' ? saveApp : mg.tab === 'game' ? saveGame : saveContainer)(g, Object.fromEntries(new FormData(f))); }
    catch (x) { err.textContent = x.message; btn.disabled = false; }
  };
}
$('#mtabs').onclick = e => { const b = e.target.closest('[data-mtab]'); if (b && mg) { mg.tab = b.dataset.mtab; renderManageBody(); } };

// ----- Files tab: browse a running container's files and edit text files -----
const fjoin = (dir, name) => (dir === '/' ? '' : dir) + '/' + name;
const fq = (g, what, p) => `guests/lxc/${g.vmid}/${what}?path=${encodeURIComponent(p)}`;
// True while the Files tab of this same app is still what is on screen (answers can arrive late).
const filesShown = me => mg === me && mg.tab === 'files' && tab === 'manage';
function renderFiles() {
  const g = mguest(), f = mg.files, box = $('#mbody'), me = mg, game = gameOf(g);
  // Game servers keep everything in one data folder, so the browser starts there and offers shortcuts into it.
  const jumps = game ? `<div class="pills">Jump to ${game.jumps().map(([l, p, file]) => `<button class="pill" type="button" data-f="${file ? 'openp' : 'cd'}" data-p="${esc(p)}">${esc(l)}</button>`).join('')}</div>` : '';
  const note = (text, btn) => { box.innerHTML = `${btn === 'Try again' ? jumps : ''}<div class="panel"><p style="margin:0">${text}</p>${btn ? `<div class="end" style="justify-content:flex-start;margin-top:12px"><button class="btn" type="button" data-f="refresh">${btn}</button></div>` : ''}</div>`; };
  if (g.self) return note('This is the App Store itself. Its files are not shown here.');
  if (!f.status) {
    box.innerHTML = '<div class="empty">Loading…</div>';
    return api('files/status').then(s => { f.status = s; }, e => { f.status = { connected: false, error: e.message }; }).then(() => { if (filesShown(me)) renderFiles(); });
  }
  if (!f.status.connected) {
    const st = f.status;
    box.innerHTML = `<div class="panel"><h3>Set up the file browser</h3>
      ${st.command ? `<p>The App Store's Proxmox token cannot read files inside a container, so the file browser goes through the Proxmox host. This is set up once.</p>
        <p>Open the <b>host's</b> shell (select your node in Proxmox → Shell), paste this command and press Enter. It installs a small helper script and an SSH key that can only run that helper. After that, the App Store can read and change files in every running, unprivileged container.</p>
        <pre id="fcmd" style="max-height:170px">${esc(st.command)}</pre>` : ''}
      ${st.error && (f.checked || !st.command) ? `<div class="err">${esc(st.error)}</div>` : ''}
      <div class="end" style="justify-content:flex-start">${st.command ? '<button class="btn primary" type="button" data-f="copy">Copy command</button>' : ''}<button class="btn" type="button" data-f="recheck">I have run it – check</button></div></div>`;
    return;
  }
  if (g.status !== 'running') return note('Start the app to browse its files.', 'Check again');
  if (f.edit) return renderEditor();
  if (f.err) return note(esc(f.err), 'Try again');
  if (!f.entries) { box.innerHTML = '<div class="empty">Loading…</div>'; return loadDir(f.path); }
  const parts = f.path.split('/').filter(Boolean);
  const crumbs = [`<button class="flink" type="button" data-f="cd" data-p="/">/</button>`, ...parts.map((s, i) => `<button class="flink" type="button" data-f="cd" data-p="${esc('/' + parts.slice(0, i + 1).join('/'))}">${esc(s)}</button>`)].join('<span class="fmeta">›</span>');
  const day = t => new Date(t * 1000).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  const row = (e, i) => {
    const dir = e.type === 'd' || e.target === 'd', file = e.type === 'f' || e.target === 'f';
    return `<div class="frow"><span class="fico">${dir ? '▸' : e.type === 'l' ? '↪' : ''}</span>
      ${dir || file ? `<button class="flink grow" type="button" data-f="${dir ? 'enter' : 'open'}" data-i="${i}">${esc(e.name)}${dir ? '/' : ''}</button>` : `<span class="grow fname">${esc(e.name)}</span>`}
      ${e.type === 'l' ? `<span class="fmeta fhide">→ ${esc(e.link || '')}</span>` : ''}
      <span class="fmeta fhide">${dir ? '' : bytes(e.size)}</span><span class="fmeta fhide">${day(e.mtime)}</span>
      ${file ? `<a class="btn sm" href="/api/${fq(g, 'download', fjoin(f.path, e.name))}" download title="Download">↓</a>` : ''}
      <button class="btn sm" type="button" data-f="rename" data-i="${i}">Rename</button><button class="btn sm danger" type="button" data-f="delete" data-i="${i}">Delete</button></div>`;
  };
  box.innerHTML = `${jumps}<div class="panel" style="max-width:none">
    <div class="frow" style="border:0;padding-top:0;flex-wrap:wrap"><div class="grow crumbs">${crumbs}</div>
      <button class="btn sm" type="button" data-f="upload">Upload</button><button class="btn sm" type="button" data-f="newfile">New file</button><button class="btn sm" type="button" data-f="newdir">New folder</button><button class="btn sm" type="button" data-f="refresh">Refresh</button></div>
    ${f.path !== '/' ? `<div class="frow"><span class="fico">▸</span><button class="flink grow" type="button" data-f="cd" data-p="${esc(f.path.replace(/\/[^/]+$/, '') || '/')}">..</button></div>` : ''}
    ${f.entries.map(row).join('') || '<div class="frow"><span class="fmeta">This folder is empty.</span></div>'}
    ${f.truncated ? '<div class="frow"><span class="fmeta">Only the first 5000 entries are shown.</span></div>' : ''}</div>`;
}
async function loadDir(p) {
  const me = mg, f = me.files, g = mguest(); if (!g) return;
  try { const r = await api(fq(g, 'files', p)); f.path = r.path; f.entries = r.entries; f.truncated = r.truncated; f.err = null; }
  catch (e) { f.entries = null; f.err = e.message; }
  if (filesShown(me)) renderFiles();
}
function renderEditor() {
  const ed = mg.files.edit;
  $('#mbody').innerHTML = `<div class="panel" style="max-width:none">
    <div class="frow" style="border:0;padding-top:0;flex-wrap:wrap"><div class="grow fname"><b>${esc(ed.path)}</b> <span class="fmeta" id="fdirty">${ed.dirty ? '· not saved' : ''}</span></div>
      <button class="btn sm" type="button" data-f="close">Close</button><button class="btn sm primary" type="button" data-f="save">Save</button></div>
    <textarea id="fedit" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="File contents"></textarea>
    <div class="err"></div><p style="margin:8px 0 0">Ctrl+S saves. Many apps read their files only when they start, so restart the app after changing its configuration.</p></div>`;
  const t = $('#fedit');
  t.value = ed.text;
  t.oninput = () => { ed.text = t.value; if (!ed.dirty) { ed.dirty = true; $('#fdirty').textContent = '· not saved'; } };
  t.onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); } };
}
async function saveFile() {
  const me = mg, ed = me.files.edit, g = mguest(); if (!ed || !g || ed.saving) return;
  const err = $('#mbody .err'); if (err) err.textContent = '';
  ed.saving = true;
  try {
    await api(`guests/lxc/${g.vmid}/files`, { op: 'write', path: ed.path, text: ed.text, crlf: ed.crlf });
    ed.dirty = false; toast(`${ed.path.split('/').pop()} saved`);
    if (filesShown(me) && me.files.edit === ed) $('#fdirty').textContent = '';
  } catch (e) { if (filesShown(me) && me.files.edit === ed && err) err.textContent = e.message; else toast(e.message); }
  ed.saving = false;
}
// A small dialog asking for one name, used for new files, new folders and renaming.
function nameDialog(title, label, value, save) {
  modal(`<h2>${esc(title)}</h2><div class="field"><label>${esc(label)}</label><input name="name" value="${esc(value)}" maxlength="255" required autocomplete="off" autofocus></div>
    <div class="err"></div><div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div>`,
    async v => {
      const name = v.name.trim();
      if (!name || name === '.' || name === '..' || name.includes('/')) throw new Error('A name cannot be empty or contain "/".');
      await save(name); closeModal();
    });
}
$('#mbody').addEventListener('click', async e => {
  const b = e.target.closest('[data-f]'), g = mguest();
  if (!b || !g || !mg || mg.tab !== 'files') return;
  const me = mg, f = me.files, act = b.dataset.f, en = f.entries && f.entries[b.dataset.i];
  const post = body => api(`guests/lxc/${g.vmid}/files`, body);
  const go = p => { f.entries = null; f.err = null; f.path = p; renderFiles(); };
  if (act === 'copy') return copyText(f.status.command, 'Command copied. Paste it in the host shell.');
  if (act === 'upload') {
    const file = await pickFile(); if (!file) return;
    const dup = (f.entries || []).some(x => x.name === file.name);
    if (dup && !confirm(`${file.name} is already in this folder. Replace it?`)) return;
    toast(`Uploading ${file.name}…`);
    try { await uploadTo(g, f.path, file, dup); toast(`${file.name} uploaded`); } catch (x) { toast(x.message); }
    if (filesShown(me) && !f.edit) go(f.path);
    return;
  }
  if (act === 'openp') {   // a shortcut straight to one file
    const p = b.dataset.p;
    try {
      const r = await api(fq(g, 'file', p));
      if (r.binary) toast('This is not a text file.');
      else if (filesShown(me)) { f.path = p.replace(/\/[^/]+$/, '') || '/'; f.entries = null; f.err = null; f.edit = { path: p, text: r.text, crlf: r.crlf, dirty: false }; renderFiles(); }
    } catch (x) { toast(x.message); }
    return;
  }
  if (act === 'recheck') { f.status = null; f.checked = true; return renderFiles(); }
  if (act === 'refresh') return go(f.path);
  if (act === 'cd') return go(b.dataset.p);
  if (act === 'close') { if (f.edit.dirty && !confirm('Close without saving your changes?')) return; f.edit = null; return go(f.path); }
  if (act === 'save') return saveFile();
  if (act === 'newfile') return nameDialog('New file', 'File name', '', async name => {
    await post({ op: 'create', dir: f.path, name, text: '' });
    f.edit = { path: fjoin(f.path, name), text: '', crlf: false, dirty: false }; if (filesShown(me)) renderFiles();
  });
  if (act === 'newdir') return nameDialog('New folder', 'Folder name', '', async name => { await post({ op: 'mkdir', dir: f.path, name }); if (filesShown(me)) go(f.path); });
  if (!en) return;
  const p = fjoin(f.path, en.name);
  if (act === 'enter') return go(p);
  if (act === 'open') {
    if (en.size > 1024 * 1024) return toast('This file is too large to open here. Download it instead.');
    b.disabled = true;
    try {
      const r = await api(fq(g, 'file', p));
      if (r.binary) toast('This is not a text file. Download it instead.');
      else if (filesShown(me)) { f.edit = { path: p, text: r.text, crlf: r.crlf, dirty: false }; renderFiles(); }
    } catch (x) { toast(x.message); }
    b.disabled = false; return;
  }
  if (act === 'rename') return nameDialog(`Rename ${en.name}`, 'New name', en.name, async name => { if (name !== en.name) await post({ op: 'rename', path: p, name }); if (filesShown(me)) go(f.path); });
  if (act === 'delete') {
    const dir = en.type === 'd';
    return modal(`<h2>Delete ${esc(en.name)}?</h2><p>${dir ? 'The folder and everything in it are' : 'The file is'} permanently removed from ${esc(g.name)}. This cannot be undone.</p>
      <div class="err"></div><div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn danger" type="submit" autofocus>Delete</button></div>`,
      async () => { await post({ op: 'delete', path: p }); closeModal(); if (filesShown(me)) go(f.path); });
  }
});
window.addEventListener('beforeunload', e => { if (mg && mg.files.edit && mg.files.edit.dirty) e.preventDefault(); });

// ----- Upload: used by the Files tab and for plugin files -----
const pickFile = accept => new Promise(res => { const i = document.createElement('input'); i.type = 'file'; if (accept) i.accept = accept; i.onchange = () => res(i.files[0] || null); i.click(); });
async function uploadTo(g, dir, file, replace) {

  const r = await fetch(`/api/guests/lxc/${g.vmid}/upload?dir=${encodeURIComponent(dir)}&name=${encodeURIComponent(file.name)}${replace ? '&replace=1' : ''}`,

// ---------- game servers ----------
// Apps marked "game" in the catalog get their own tabs on the Manage page: Console, Plugins, Files and Settings.
const MC_MODS = ['FABRIC', 'QUILT', 'FORGE', 'NEOFORGE'];
const envOf = k => mg && mg.s && mg.s.env ? (mg.s.env.find(e => e[0] === k) || [])[1] : undefined;
const plugWord = () => MC_MODS.includes(String(envOf('TYPE') || '').toUpperCase()) ? 'Mods' : 'Plugins';
const GAMES = {
  minecraft: { port: 25565, portKey: 'SERVER_PORT', data: '/data',
    jumps: () => [['server.properties', '/data/server.properties', 1], ['World', '/data/world'], [plugWord(), '/data/' + plugWord().toLowerCase()], ['Logs', '/data/logs'], ['Whole container', '/']] },
};
const gameOf = g => g && g.type === 'lxc' && !g.self ? GAMES[(catalog.find(a => a.id === g.app) || {}).game] : undefined;
const gameCmd = async (g, command) => (await api(`guests/lxc/${g.vmid}/game/command`, { command })).output;

// ----- Console tab: the server's log, a command line, and who is online -----
// Built once and then only added to, so the log keeps its scroll position and a half-typed command is never lost.
let conTimer = null;
const conShown = me => mg === me && me.tab === 'console' && tab === 'manage' && !!$('#clog');
function renderConsole() {
  if (!$('#clog')) {
    $('#mbody').innerHTML = `<div class="gwrap"><section class="con" aria-label="Console">
        <div class="conbar"><span id="cstate"></span><span class="grow"></span>
          <label><input type="checkbox" id="cfollow" checked> Follow new lines</label><button class="btn sm" type="button" data-g="clear">Clear</button></div>
        <div class="clog" id="clog" role="log" tabindex="0" aria-label="Server log"></div>
        <form class="cin" id="cform"><b aria-hidden="true">›</b>
          <input id="ccmd" aria-label="Server command" placeholder="Type a command and press Enter" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="1000">
          <button class="btn sm primary" type="submit">Send</button></form>
      </section><aside class="card side" id="players" aria-label="Players"></aside></div>`;
    const c = mg.con; c.pos = null; c.sig = ''; c.wait = 0;
    $('#cform').onsubmit = e => { e.preventDefault(); sendCommand(); };
    $('#ccmd').onkeydown = e => {   // arrow up and down walk through the commands sent earlier
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      c.hi = Math.max(0, Math.min(c.hist.length, c.hi + (e.key === 'ArrowUp' ? -1 : 1)));
      e.target.value = c.hist[c.hi] || '';
    };
  }
  conState(); renderPlayers();
  if (!conTimer) conTimer = setInterval(conTick, 3000);
  conTick();
}
function conState() {
  const g = mguest(), c = mg.con, on = g.status === 'running';
  $('#cstate').className = !on ? '' : c.err ? 'bad' : 'live';
  $('#cstate').textContent = !on ? 'The server is stopped. Start it to see the console.' : c.err ? c.err + (/helper|ssh/i.test(c.err) ? ' The console reads the log through the file browser, which is set up on the Files tab.' : '') : '● Live';
  $('#ccmd').disabled = $('#cform button').disabled = !on;
}
function conAdd(text, cls) {
  const log = $('#clog'); if (!log || !text) return;
  const frag = document.createDocumentFragment();
  for (const raw of text.replace(/\n$/, '').split('\n')) {
    const line = raw.replace(/\x1b\[[0-9;]*m/g, '').replace(/\r$/, ''), d = document.createElement('div');
    d.textContent = line || ' ';
    d.className = cls || (/\b(ERROR|SEVERE|FATAL)\b|Exception/.test(line) ? 'e' : /\bWARN/.test(line) ? 'w' : /(joined|left) the game/.test(line) ? 'j' : '');
    frag.append(d);
  }
  log.append(frag);
  while (log.childElementCount > 3000) log.firstChild.remove();
  if ($('#cfollow').checked) log.scrollTop = log.scrollHeight;
}
// Every three seconds while the tab is open: fetch the new log lines, and every other time the player list.
async function conTick() {
  const me = mg, g = mguest();
  if (!me || !g || !conShown(me)) { clearInterval(conTimer); conTimer = null; return; }
  const c = me.con;
  if (c.busy || document.hidden || Date.now() < c.wait) return;
  c.busy = true;
  if (g.status !== 'running') {
    if (c.pos != null) conAdd('The server stopped.', 'n');
    c.pos = null; c.err = null; c.players = null; c.perr = null; c.open = null;
  } else {
    try {
      const r = await api(`guests/lxc/${g.vmid}/game/log` + (c.pos == null ? '' : '?pos=' + c.pos));
      if (conShown(me)) { if (c.pos == null || r.reset) $('#clog').textContent = ''; c.pos = r.pos; c.err = null; conAdd(r.text); }
    } catch (e) { c.err = e.message; c.wait = Date.now() + 10000; }
    if (!(c.n++ % 2)) await loadPlayers(me, g);
  }
  c.busy = false;
  if (conShown(me)) { conState(); renderPlayers(); }
}
async function sendCommand() {
  const me = mg, g = mguest(), c = me.con, inp = $('#ccmd'), cmd = inp.value.trim().replace(/^\//, '');
  if (!cmd || !g) return;
  if (c.hist[c.hist.length - 1] !== cmd) c.hist.push(cmd);
  if (c.hist.length > 50) c.hist.shift();
  c.hi = c.hist.length; inp.value = '';
  conAdd('› ' + cmd, 'c');
  try { const out = await gameCmd(g, cmd); if (conShown(me)) conAdd(out.trim() || 'Done.', 'n'); }
  catch (x) { if (conShown(me)) conAdd(x.message, 'e'); }
}
async function loadPlayers(me, g) {
  try { me.con.players = await api(`guests/lxc/${g.vmid}/game/players`); me.con.perr = null; }
  catch (e) { me.con.players = null; me.con.perr = e.message; }
}
function renderPlayers() {
  const box = $('#players'), g = mguest(); if (!box || !g) return;

  // Redrawn only when something changed, so an open menu is not closed under the mouse.

  const btn = (act, label, cls = '', extra = '') => `<button class="btn sm ${cls}" type="button" data-g="${act}" ${extra}>${label}</button>`;
  const row = p => `<div class="prow"><div class="ico">${esc(p.name.replace(/^\W+/, '')[0] || '?').toUpperCase()}</div>
      <div class="grow"><div class="name">${esc(p.name)}</div>${p.op ? '<div class="sub">Operator</div>' : ''}</div>
      ${btn('pmenu', 'Manage', '', `data-n="${esc(p.name)}" aria-expanded="${c.open === p.name}"`)}</div>
    ${c.open === p.name ? `<div class="pmenu" data-n="${esc(p.name)}">${btn('pmsg', 'Message')}${btn(p.op ? 'pdeop' : 'pop', p.op ? 'Remove operator' : 'Make operator')}${btn('pkick', 'Kick', 'danger')}${btn('pban', 'Ban', 'danger')}
      <select data-g="pmode" aria-label="Game mode for ${esc(p.name)}"><option value="">Set game mode…</option>${['Survival', 'Creative', 'Adventure', 'Spectator'].map(m => `<option value="${m.toLowerCase()}">${m}</option>`).join('')}</select></div>` : ''}`;
  box.innerHTML = `<div class="prow"><b class="grow" style="font-size:15px">Players</b>${P ? `<span class="dot running">${P.online}${P.max ? ' of ' + P.max : ''} online</span>` : ''}</div>

    ${P ? `<div class="prow pfoot">${btn('plist', 'Whitelist', '', 'data-k="whitelist"')}${btn('plist', 'Ban list', '', 'data-k="bans"')}${btn('plist', 'Operators', '', 'data-k="ops"')}</div>` : ''}`;

// Whitelist, ban list and operators: shows the list and adds or removes one player by name.
function listDialog(g, kind) {
  const [title, list, add, remove, text] = {
    whitelist: ['Whitelist', 'whitelist list', 'whitelist add', 'whitelist remove', 'When the whitelist is turned on under Settings, only these players can join.'],
    bans: ['Ban list', 'banlist', 'ban', 'pardon', 'Banned players cannot join until they are removed from this list.'],

// ----- Plugins tab (Mods on Fabric and Forge servers) -----
const plugShown = me => mg === me && me.tab === 'plugins' && tab === 'manage';

}

function renderHits() {
  const box = $('#phits'), P = mg.plug; if (!box) return;

    <div class="gwrap"><section class="panel" style="flex:999 1 480px">

// Buttons on the Console and Plugins tabs.
async function gameAct(act, el) {
  const g = mguest(), me = mg; if (!g || !me || !gameOf(g)) return;
  const c = me.con, P = me.plug, name = (el.closest('[data-n]') || {}).dataset?.n, item = P.data && P.data.items[el.dataset.i];
  const post = body => api(`guests/lxc/${g.vmid}/game/plugins`, body);
  // Runs a command about one player, shows the server's answer, and fetches the player list again.
  const player = async cmd => {
    try { toast((await gameCmd(g, cmd)).split('\n')[0] || 'Done'); } catch (x) { toast(x.message); }
    await loadPlayers(me, g); if (conShown(me)) renderPlayers();
  };
  const ask = (title, text, label, action, cmd, danger) => modal(`<h2>${esc(title)}</h2><p>${text}</p>
    <div class="field"><label>${label}</label><input name="t" maxlength="200" autocomplete="off" autofocus></div><div class="err"></div>
    <div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" type="submit">${action}</button></div>`,
    async v => { const t = v.t.replace(/[\x00-\x1f\x7f]/g, ' ').trim(); if (!danger && !t) throw new Error('Write a message first.'); closeModal(); player(`${cmd} ${name} ${t}`.trim()); });
  const toFiles = p => { const f = me.files; me.tab = 'files'; f.path = p; f.entries = null; f.err = null; f.edit = null; renderManageBody(); };
  const changed = () => { P.dirty = true; P.data = null; if (plugShown(me)) renderPlugins(); };

  if (act === 'clear') return void ($('#clog').textContent = '');
  if (act === 'pmenu') { c.open = c.open === name ? null : name; return renderPlayers(); }
  if (act === 'pop') return player(`op ${name}`);
  if (act === 'pdeop') return player(`deop ${name}`);
  if (act === 'pmode') { const mode = el.value; el.value = ''; return player(`gamemode ${mode} ${name}`); }
  if (act === 'pmsg') return ask(`Message to ${name}`, 'Only this player sees the message.', 'Message', 'Send', 'tell');
  if (act === 'pkick') return ask(`Kick ${name}?`, 'The player is disconnected, and can join again right away.', 'Reason (optional)', 'Kick', 'kick', true);
  if (act === 'pban') return ask(`Ban ${name}?`, 'The player is disconnected and cannot join again until you remove them from the ban list.', 'Reason (optional)', 'Ban', 'ban', true);
  if (act === 'plist') return listDialog(g, el.dataset.k);

  if (act === 'preload') { P.data = null; P.err = null; return renderPlugins(); }
  if (act === 'psettings') { me.tab = 'game'; return renderManageBody(); }
  if (act === 'prestart') { P.dirty = false; renderPlugins(); return doAction(g, 'reboot'); }
  if (act === 'ppaper') return modal(`<h2>Switch to Paper?</h2><p>The server restarts as a Paper server and players are disconnected for a few minutes. Your world and settings are kept. You can switch back under Settings.</p>
    <div class="err"></div><div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit" autofocus>Switch and restart</button></div>`,
    async () => {
      if (!me.s) throw new Error('The settings are still loading. Try again in a moment.');
      await api(`guests/lxc/${g.vmid}/app`, { env: { ...Object.fromEntries(me.s.env), TYPE: 'PAPER' } });
      closeModal(); P.data = null; await loadManage(); doAction(g, 'reboot');
    });
  if (!P.data) return;
  if (act === 'pfolder') return toFiles(P.data.dir);
  if (act === 'pupload') {
    const file = await pickFile('.jar'); if (!file) return;
    if (!/\.jar$/i.test(file.name)) return toast('Choose a .jar file.');
    const dup = P.data.items.some(x => x.file === file.name);
    if (dup && !confirm(`${file.name} is already installed. Replace it?`)) return;
    toast(`Uploading ${file.name}…`);
    try { await uploadTo(g, P.data.dir, file, dup); toast(`${file.name} uploaded`); changed(); } catch (x) { toast(x.message); }
    return;
  }
  if (act === 'pinstall') {
    const h = P.hits && P.hits[el.dataset.i]; if (!h) return;
    el.disabled = true; el.textContent = 'Installing…';
    try {
      const r = await post({ op: 'install', id: h.id });
      toast(`${h.title} ${r.version} installed` + (r.needs ? `. It needs ${r.needs} other ${r.needs > 1 ? 'plugins or mods' : 'plugin or mod'} to work; its page on Modrinth lists them.` : ''));
      changed();
    } catch (x) { toast(x.message); if (el.isConnected) { el.disabled = false; el.textContent = 'Install'; } }
    return;
  }
  if (!item) return;
  if (act === 'pconfig') return toFiles(item.config);

  if (act === 'pdel') return modal(`<h2>Delete ${esc(item.name)}?</h2><p>The file ${esc(item.file)} is removed from the server. Its settings folder is kept.</p>

async function saveGame(g, v) {
  // The variables keep their order, so saving without a change is not mistaken for one.
  const fields = MC_FORM.flatMap(x => x[1]), keys = fields.map(f => f.k), env = new Map(mg.s.env), extra = new Map();
  for (const line of v.extra.split('\n').map(l => l.trim()).filter(Boolean)) {
    const m = /^(\w+)=(.*)$/.exec(line); if (!m) throw new Error(`"${line}" is not in the form KEY=value`);
    if (keys.includes(m[1])) throw new Error(`${m[1]} has its own field above. Change it there.`);
    extra.set(m[1], m[2]);
  }
  for (const k of [...env.keys()]) if (!keys.includes(k) && !extra.has(k)) env.delete(k);
  for (const [k, val] of extra) env.set(k, val);
  for (const f of fields) {
    const val = f.bool ? ('env:' + f.k in v ? 'TRUE' : 'FALSE') : String(v['env:' + f.k] ?? '').trim(), old = env.get(f.k) ?? f.def ?? '';
    if (val.toLowerCase() === old.toLowerCase()) continue;   // not changed: leave it exactly as it is, set or not
    if (val === '') env.delete(f.k); else env.set(f.k, val);
  }
  const r = await api(`guests/lxc/${g.vmid}/app`, { env: Object.fromEntries(env) });
  const restart = r.envChanged && 'restart' in v;
  toast(`${g.name}: ${r.envChanged ? 'settings saved' : 'nothing changed'}${restart ? ', restarting' : r.envChanged ? '. Restart the server to use them' : ''}`);
  mg.plug.data = null;
  await loadManage();
  if (restart) doAction(g, 'reboot'); else refresh();
}

      };
      if (!custom && v['adv:image'] && v['adv:image'].trim() !== a.image) advanced.image = v['adv:image'].trim();
      await api('install', { appId: a.id, image: v.image, port: v.port, hostname: v.hostname, cores: v.cores, memory: v.memory, disk: v.disk, env, advanced });
      closeModal(); show('activity'); pollJobs();
    });
  const net = $('#modal [name="adv:net"]');
  net.onchange = () => $('#staticNet').classList.toggle('hidden', net.value !== 'static');
  // Open the advanced section if a hidden field in it fails validation, so the browser can show the message.
  $('#modal form').addEventListener('invalid', e => { const d = e.target.closest('details'); if (d) d.open = true; }, true);
}

// ---------- activity ----------
function renderJobs() {
  const active = jobs.filter(j => j.status === 'queued' || j.status === 'running').length;
  $('#jobBadge').textContent = active; $('#jobBadge').classList.toggle('hidden', !active);
  if (tab !== 'activity') return;
  $('#jobs').innerHTML = jobs.map(j => `<div class="job ${esc(j.status)}">
    ${j.status === 'done' ? '<div class="mark" style="color:var(--ok)">✓</div>' : j.status === 'failed' ? '<div class="mark" style="color:var(--bad)">✕</div>' : '<div class="spin"></div>'}
    <div class="grow"><div class="name">${esc(j.appName)} <span class="sub">${esc(j.hostname)}${j.vmid ? ' · container ' + j.vmid : ''}</span></div>
    <div class="st">${esc(j.status === 'failed' ? j.error : j.status === 'done' && j.ip && !j.url ? 'Installed at ' + j.ip : j.step)}</div></div>
    ${j.status === 'done' && j.url ? `<a class="btn sm primary" href="${esc(j.url)}" target="_blank" rel="noopener">Open</a>` : ''}</div>`).join('')
    || '<div class="empty">No installs yet. Pick something from the Store.</div>';
}
let jobTimer, seen = {};
async function pollJobs() {
  clearTimeout(jobTimer);
  try { jobs = await api('jobs'); } catch {}
  for (const j of jobs) {
    if ((j.status === 'done' || j.status === 'failed') && seen[j.id] === 'active') { toast(j.status === 'done' ? `${j.appName} is installed` : `${j.appName} failed to install`); refresh(); }
    seen[j.id] = j.status === 'done' || j.status === 'failed' ? 'final' : 'active';
  }
  renderJobs();
  jobTimer = setTimeout(pollJobs, jobs.some(j => j.status === 'queued' || j.status === 'running') ? 1500 : 15000);
}

// ---------- shortcuts ----------
let shortcuts = null;
async function renderShortcuts() {
  if (!shortcuts) {
    $('#links').innerHTML = '<div class="empty">Loading…</div>';
    try { shortcuts = await api('shortcuts'); } catch (e) { $('#links').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  }
  const q = $('#lq').value.toLowerCase();
  $('#links').innerHTML = shortcuts.filter(s => !q || (s.name + ' ' + s.url + ' ' + s.notes).toLowerCase().includes(q)).map(s => `
    <div class="app"><div class="row">${icon('', s.name)}<div class="grow">
        <a class="name" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a>
        <div class="sub">${esc(s.url.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</div></div></div>
      <p class="notes">${esc(s.notes)}</p>
      <div class="foot"><a class="btn sm primary" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Open</a>
        <span><button class="btn sm" data-edit="${esc(s.id)}">Edit</button> <button class="btn sm danger" data-del="${esc(s.id)}">Delete</button></span></div></div>`).join('')
    || `<div class="empty">${shortcuts.length ? 'Nothing matches.' : 'No shortcuts yet. Add a link you want to keep, with a note about what it is for.'}</div>`;
}
function shortcutDialog(s) {
  modal(`<h2>${s ? 'Edit shortcut' : 'Add shortcut'}</h2>
    <div class="field"><label>Link</label><input name="url" value="${esc(s ? s.url : '')}" placeholder="google.com" maxlength="2000" required autofocus></div>
    <div class="field"><label>Name (optional)</label><input name="name" value="${esc(s ? s.name : '')}" maxlength="80"></div>
    <div class="field"><label>Notes</label><textarea name="notes" maxlength="4000" style="font:inherit;min-height:110px">${esc(s ? s.notes : '')}</textarea></div>
    <div class="err"></div>
    <div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div>`,
    async v => {
      const r = await api('shortcuts', { ...v, id: s ? s.id : undefined });
      if (s) shortcuts[shortcuts.indexOf(s)] = r; else shortcuts.push(r);
      closeModal(); renderShortcuts();
    });
}
$('#lq').oninput = renderShortcuts;
$('#addLink').onclick = () => shortcuts && shortcutDialog();
$('#links').onclick = e => {
  const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
  const s = shortcuts.find(x => x.id === (ed || del || {dataset: {}}).dataset[ed ? 'edit' : 'del']);
  if (!s) return;
  if (ed) return shortcutDialog(s);
  modal(`<h2>Delete ${esc(s.name)}?</h2><p>The link and its notes are removed.</p>
    <div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn danger" type="submit" autofocus>Delete</button></div>`,
    async () => { await api(`shortcuts/${s.id}/delete`, {}); shortcuts = shortcuts.filter(x => x !== s); closeModal(); renderShortcuts(); });
};

// ---------- update button ----------
// Shown in the top bar only while GitHub has a newer version than the one running.
let upd = null;
const changeList = r => `<ul>${(r.changes || []).map(c => `<li><span class="kind ${esc(c.type)}">${esc({ new: 'New', improved: 'Improved', fixed: 'Fixed' }[c.type] || c.type)}</span><span>${esc(c.text)}</span></li>`).join('')}</ul>`;
async function checkUpdate() {
  try { upd = await api('update'); } catch { return; }
  $('#updateBtn').classList.toggle('hidden', !upd.available);
}
$('#updateBtn').onclick = () => {
  const how = {
    button: '<p>Updating takes a few seconds. You may have to sign in again afterwards.</p>',
    auto: '<p>Automatic updates are on, so this version installs itself within about a minute. Reload the page after that.</p>',
    manual: `<p>To install it, open the App Store container's console in Proxmox and run:</p><pre>cd /opt/appstore && git pull && systemctl restart appstore</pre>
      <p>The README's Updating section shows how to let this button install updates for you.</p>`,
  }[upd.mode];
  modal(`<h2>Update available</h2><p>A newer version of the App Store is on GitHub.</p>
    ${(upd.releases || []).map(r => `<div class="rel"><h3>Version ${esc(r.version)}</h3>${changeList(r)}</div>`).join('')}
    ${how}<div class="err"></div>
    <div class="end"><button class="btn" type="button" data-close>Close</button>${upd.mode === 'button' ? '<button class="btn primary" type="submit" autofocus>Update now</button>' : ''}</div>`,
    async (v, f) => {
      await api('update', {});
      f.querySelector('[type=submit]').textContent = 'Updating…';
      // The server restarts on the new version. A lost session reloads the page by itself (see api()).
      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 2000));
        try { if ((await api('update')).running !== upd.running) return location.reload(); } catch {}
      }
      f.querySelector('[type=submit]').textContent = 'Update now';
      throw new Error('The update has not finished. In the container, run: journalctl -u appstore-update -n 20');
    });
};

// ---------- shell ----------
// ---------- changelog ----------
let releases = null;
async function renderChangelog() {
  if (!releases) {
    $('#releases').innerHTML = '<div class="empty">Loading…</div>';
    try { releases = await api('changelog'); } catch (e) { $('#releases').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  }
  const day = d => { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? d : t.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); };
  $('#releases').innerHTML = releases.map((r, i) => `<article class="rel">
    <div class="relhead"><h2>Version ${esc(r.version)}</h2>${i ? '' : '<span class="tag latest">Latest</span>'}<span class="sub">${esc(day(r.date))}</span></div>
    ${changeList(r)}
  </article>`).join('') || '<div class="empty">No changes recorded yet.</div>';
}

function show(t) {
  // Leaving the Manage page drops what is open in the file editor.
  if (tab === 'manage' && t !== 'manage' && mg && mg.files.edit && mg.files.edit.dirty && !confirm('Leave without saving your changes to the file?')) return;
  tab = t;
  for (const s of ['overview', 'manage', 'store', 'shortcuts', 'activity', 'changelog']) $('#' + s).classList.toggle('hidden', s !== t);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === (t === 'manage' ? 'overview' : t)));
  ({ overview: renderOverview, manage: renderManage, store: renderStore, shortcuts: renderShortcuts, activity: renderJobs, changelog: renderChangelog })[t]();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
$('#logout').onclick = async () => { await api('logout', {}); location.reload(); };

(async () => {
  state = await api('state');
  if (!state.configured) return showSetup();
  if (!state.authed) return showLogin();
  $('#hdr').classList.remove('hidden');
  catalog = await api('catalog');
  show('overview');
  await refresh(); pollJobs();
  checkUpdate(); setInterval(checkUpdate, 15 * 60 * 1000);
  setInterval(() => { if (!document.hidden) refresh(); }, 5000);
})().catch(e => toast(e.message));
</script>
