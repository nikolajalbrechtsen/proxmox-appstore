<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxmox App Store</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e57000'/><path d='M9 12h14l-1.5 11h-11zM12 12a4 4 0 0 1 8 0' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--panel2:#f0f1f4;--line:#e1e3e8;--text:#1a1d23;--muted:#6b7280;
  --accent:#e57000;--accent-text:#fff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--panel:#181b21;--panel2:#20242c;--line:#2a2f39;--text:#e8eaee;--muted:#8b93a1;
  --accent:#ff8a1f;--accent-text:#1a1000;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:auto;padding:0 16px;display:flex;align-items:center;gap:20px;height:56px}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-text);font-style:normal;font-size:15px}
nav{display:flex;gap:4px;height:100%}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:0 12px;cursor:pointer;color:var(--muted);font-weight:600}
nav button.on{color:var(--text);border-color:var(--accent)}
.badge{background:var(--accent);color:var(--accent-text);border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px}
.spacer{flex:1}
main{max-width:1200px;margin:auto;padding:20px 16px 60px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat,.card,.app{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.stat{padding:14px 16px}
.stat .k{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:20px;font-weight:700;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500}
.meter{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.meter b{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.meter b.hot{background:var(--bad)}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tools input,.tools select,.field input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:0}
.tools input{flex:1;min-width:160px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.off{opacity:.75}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.ico{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--muted);flex:none;overflow:hidden}
.ico img{width:28px;height:28px;object-fit:contain}
.name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.dot:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.running{color:var(--ok)}.dot.running:before{background:var(--ok)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:12px;color:var(--muted)}
.mini span{display:flex;justify-content:space-between;margin-bottom:3px;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:var(--panel2);border-radius:5px;padding:1px 7px;font-size:11.5px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.app{padding:16px;display:flex;flex-direction:column;gap:10px}
.app p{margin:0;color:var(--muted);font-size:13px;flex:1}
.app .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.app.custom{border-style:dashed}
.empty{color:var(--muted);text-align:center;padding:50px 0;grid-column:1/-1}
.group{grid-column:1/-1;margin:10px 0 0;font-size:15px}
.group:first-child{margin-top:0}
.group small{color:var(--muted);font-weight:500}
.job{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.job .st{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.job.failed .st{color:var(--bad)}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.mark{width:18px;text-align:center;font-weight:700;flex:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:18px}
.modal p{color:var(--muted);margin:4px 0 14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input{width:100%}
.field textarea,.field select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;width:100%;font:inherit;color:inherit}
.field textarea{min-height:70px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
details.adv{border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:12px}
details.adv summary{cursor:pointer;font-weight:600;padding:10px 0;user-select:none}
details.adv[open] summary{margin-bottom:6px}
.app.click{cursor:pointer;transition:border-color .15s}
.app.click:hover,.app.click:focus-visible{border-color:var(--accent);outline:none}
.modal.wide{max-width:760px}
.shot{display:block;width:100%;max-height:400px;object-fit:contain;background:var(--panel2);border-radius:10px}
.thumbs{display:flex;gap:8px;margin:8px 0 0;overflow-x:auto}
.thumb{flex:none;padding:0;border:2px solid transparent;border-radius:8px;background:var(--panel2);cursor:pointer;overflow:hidden;height:58px}
.thumb.on{border-color:var(--accent)}
.thumb img{height:100%;width:90px;object-fit:cover;display:block}
.info{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:14px 0;font-size:13px}
.info dt{color:var(--muted);font-weight:600}
.info dd{margin:0;overflow-wrap:anywhere}
.info code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.modal a{color:var(--accent)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.end{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.mhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mhead .name{font-size:18px}
.mhead .actions{margin:0}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.subtabs button.on{color:var(--text);border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;max-width:760px}
.panel h3{margin:20px 0 10px;font-size:14px}
.panel h3:first-child{margin-top:0}
.panel p{color:var(--muted);margin:0 0 12px;font-size:13px}
.panel .info{margin-top:0}
@media (max-width:560px){.three{grid-template-columns:1fr 1fr}}
.frow{display:flex;align-items:center;gap:10px;padding:6px 2px;border-top:1px solid var(--line);min-width:0}
.fico{width:14px;flex:none;color:var(--muted);text-align:center}
.flink{background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.flink:hover{color:var(--accent)}
.fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fmeta{color:var(--muted);font-size:12.5px;white-space:nowrap;flex:none;max-width:30%;overflow:hidden;text-overflow:ellipsis}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.crumbs .flink{flex:none;max-width:100%}
#fedit{display:block;width:100%;height:60vh;min-height:240px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12.5px/1.5 ui-monospace,Consolas,monospace;tab-size:4;white-space:pre;overflow:auto}
@media (max-width:700px){.fhide{display:none}}
.app p.notes{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.app a.name{color:inherit;text-decoration:none;display:block}
.app a.name:hover{text-decoration:underline}
.modal h3{margin:12px 0 6px;font-size:14px}
.modal .rel{box-shadow:none;padding:0;border:0;margin-bottom:14px}
nav{min-width:0;overflow-x:auto}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:4px 0}
pre{background:var(--panel2);border-radius:8px;padding:10px;font-size:11.5px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0 0 12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;z-index:30;max-width:90vw}
@media (max-width:560px){.bar{gap:10px}.logo span{display:none}.grid{grid-template-columns:1fr}}
#releases{max-width:760px}
.rel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.relhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.relhead h2{margin:0;font-size:16px}
.relhead .sub{margin-left:auto}
.tag.latest{background:var(--accent);color:var(--accent-text);font-weight:600}
.rel ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rel li{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline}
.kind{font-size:11.5px;font-weight:700;text-align:center;border-radius:5px;padding:2px 0;background:var(--panel2);color:var(--muted)}
.kind.new{color:var(--ok)}
.kind.fixed{color:var(--warn)}
@media (max-width:560px){nav button{padding:0 8px}}
</style>
</head>
<body>
<header class="hidden" id="hdr"><div class="bar">
  <div class="logo"><i>▣</i><span>Proxmox App Store</span></div>
  <nav>
    <button data-tab="overview" class="on">My apps</button>
    <button data-tab="store">Store</button>
    <button data-tab="shortcuts">Shortcuts</button>
    <button data-tab="activity">Activity<span class="badge hidden" id="jobBadge"></span></button>
    <button data-tab="changelog">Changelog</button>
  </nav>
  <div class="spacer"></div>
  <button class="btn sm primary hidden" id="updateBtn">Update</button>
  <button class="btn sm" id="logout">Sign out</button>
</div></header>

<main>
  <section id="overview" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input id="gq" type="search" placeholder="Search apps and containers…" aria-label="Search">
      <select id="gf" aria-label="Filter"><option value="">All</option><option value="running">Running</option><option value="stopped">Stopped</option><option value="lxc">Containers</option><option value="qemu">Virtual machines</option></select>
    </div>
    <div class="grid" id="guests"></div>
  </section>
  <section id="manage" class="hidden">
    <div class="mhead" id="mhead"></div>
    <div class="stats" id="mstats"></div>
    <div class="subtabs" id="mtabs"></div>
    <div id="mbody"></div>
  </section>
  <section id="store" class="hidden">
    <div class="tools">
      <input id="sq" type="search" placeholder="Search the store…" aria-label="Search the store">
      <select id="sc" aria-label="Category"></select>
    </div>
    <div class="grid" id="apps"></div>
  </section>
  <section id="shortcuts" class="hidden">
    <div class="tools">
      <input id="lq" type="search" placeholder="Search shortcuts…" aria-label="Search shortcuts">
      <button class="btn primary" id="addLink">Add shortcut</button>
    </div>
    <div class="grid" id="links"></div>
  </section>
  <section id="activity" class="hidden"><div id="jobs"></div></section>
  <section id="changelog" class="hidden"><div id="releases"></div></section>
</main>
<div id="modal"></div>
<div id="toast" class="hidden" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS = 'https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/';
let state = {}, data = null, catalog = [], jobs = [], tab = 'overview', busy = {};

async function api(path, body) {
  const r = await fetch('/api/' + path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== 'login') { if (state.authed) location.reload(); throw new Error(j.error || 'Not signed in'); }
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 4500); }
const bytes = b => { if (!b) return '0'; const u = ['B','KB','MB','GB','TB']; const i = Math.min(4, Math.floor(Math.log(b) / Math.log(1024))); return (b / 1024 ** i).toFixed(i > 2 ? 1 : 0) + ' ' + u[i]; };
const upt = s => s > 86400 ? Math.floor(s / 86400) + 'd ' + Math.floor(s % 86400 / 3600) + 'h' : s > 3600 ? Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm' : Math.floor(s / 60) + 'm';
// Replaces {{hex16}} / {{hex64}} in catalog defaults with a random value of that length.
const fill = s => String(s ?? '').replace(/\{\{hex(\d+)\}\}/g, (_, n) => [...crypto.getRandomValues(new Uint8Array(n / 2))].map(b => b.toString(16).padStart(2, '0')).join(''));
const pct = (a, b) => b ? Math.min(100, a / b * 100) : 0;
const meter = p => `<div class="meter"><b class="${p > 90 ? 'hot' : ''}" style="width:${p.toFixed(1)}%"></b></div>`;
const icon = (slug, name) => `<div class="ico">${slug ? `<img src="${ICONS}${esc(slug)}.svg" alt="" loading="lazy" onerror="this.replaceWith('${esc(name[0] || '?').toUpperCase()}')">` : esc(name[0] || '?').toUpperCase()}</div>`;

// ---------- modal helpers ----------
function modal(html, onSubmit, dismissable = true, cls = '') {
  $('#modal').innerHTML = `<div class="overlay"><form class="modal ${cls}" role="dialog" aria-modal="true">${html}</form></div>`;
  const f = $('#modal form');
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('[type=submit]'), err = f.querySelector('.err');
    btn.disabled = true; if (err) err.textContent = '';
    try { await onSubmit(Object.fromEntries(new FormData(f)), f); }
    catch (x) { if (err) err.textContent = x.message; else toast(x.message); btn.disabled = false; }
  };
  if (dismissable) {
    $('#modal .overlay').onmousedown = e => { if (e.target.classList.contains('overlay')) closeModal(); };
    f.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  }
  (f.querySelector('[autofocus]') || f.querySelector('input'))?.focus();
}
const closeModal = () => $('#modal').innerHTML = '';
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.authed) closeModal(); });

// ---------- setup & login ----------
function showSetup() {
  // Installed with install.sh: the connection to Proxmox is already prepared, only the password is missing.
  if (state.preseeded) return modal(`<h2>Welcome to App Store</h2>
    <p>The installer has already connected it to Proxmox. Choose a password to finish. You sign in to the App Store with it.</p>
    <div class="field"><label>Password</label><input name="password" type="password" minlength="8" required autocomplete="new-password" autofocus></div>
    <div class="err"></div>
    <div class="end"><button class="btn primary" type="submit">Finish</button></div>`,
    async v => { await api('setup', v); location.reload(); }, false);
  modal(`<h2>Welcome to App Store</h2>
    <p>Connect it to Proxmox with an API token. Run this once in the Proxmox host shell (Datacenter → pve → Shell), then paste the result below.</p>
    <pre>pveum role add AppStore -privs "VM.Allocate,VM.Audit,VM.PowerMgmt,VM.Config.Disk,VM.Config.CPU,VM.Config.Memory,VM.Config.Network,VM.Config.Options,VM.GuestAgent.Audit,Datastore.AllocateSpace,Datastore.AllocateTemplate,Datastore.Audit,Sys.Audit,Sys.AccessNetwork,SDN.Use"
pveum user add appstore@pve
pveum acl modify / -user appstore@pve -role AppStore
pveum user token add appstore@pve web --privsep 0</pre>
    <div class="field"><label>Proxmox host</label><input name="host" placeholder="IP address of your Proxmox host" required></div>
    <div class="field"><label>Token ID</label><input name="tokenId" value="appstore@pve!web" required autocomplete="off"></div>
    <div class="field"><label>Token secret (the "value" printed by the last command)</label><input name="secret" ${state.dev ? '' : 'required'} autocomplete="off" autofocus></div>
    <div class="field"><label>Choose a password for this App Store</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div>
    <div class="err"></div>
    <div class="end"><button class="btn primary" type="submit">Connect</button></div>`,
    async v => { await api('setup', v); location.reload(); }, false);
}
function showLogin() {
  modal(`<h2>App Store</h2><p>Sign in to manage your apps.</p>
    <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password" autofocus></div>
    <div class="err"></div><div class="end"><button class="btn primary" type="submit">Sign in</button></div>`,
    async v => { await api('login', v); location.reload(); }, false);
}

// ---------- overview ----------
const catOf = g => catalog.find(a => a.id === g.app) || catalog.find(a => g.name.includes(a.id));
const guestIcon = g => { const c = catOf(g); return icon(c ? c.icon : g.name.replace(/[^a-z0-9-]/g, ''), g.name); };
const guestState = g => busy[g.vmid] ? '<div class="spin"></div>' : `<span class="dot ${esc(g.status)}">${g.status === 'running' ? 'Running' : 'Stopped'}</span>`;
// Open / Start / Restart / Stop / Delete buttons, shared by the cards and the Manage page.
function guestButtons(g, manage) {
  const on = g.status === 'running';
  const a = (act, label, cls = '') => `<button class="btn sm ${cls}" data-act="${act}" data-id="${g.vmid}" ${busy[g.vmid] || (g.self && act !== 'start' && act !== 'manage') ? 'disabled' : ''}>${label}</button>`;
  return (g.url && on ? `<a class="btn sm primary" href="${esc(g.url)}" target="_blank" rel="noopener">Open</a>` : '')
    + (on ? a('reboot', 'Restart') + a('shutdown', 'Stop') : a('start', 'Start')) + (manage ? a('manage', 'Manage') : '') + (on ? '' : a('delete', 'Delete', 'danger'));
}
function renderOverview() {
  if (!data) return;
  const h = data.host, st = data.storages;
  const run = data.guests.filter(g => g.status === 'running').length;
  $('#stats').innerHTML = [
    ['Apps/VMs running', `${run} <small>of ${data.guests.length}</small>`, pct(run, data.guests.length)],
    ['Host CPU', `${(h.cpu * 100).toFixed(0)}% <small>of ${h.maxcpu} cores</small>`, h.cpu * 100],
    ['Host memory', `${bytes(h.mem)} <small>of ${bytes(h.maxmem)}</small>`, pct(h.mem, h.maxmem)],
    ...st.map(s => [`Storage · ${esc(s.name)}`, `${bytes(s.used)} <small>of ${bytes(s.total)}</small>`, pct(s.used, s.total)]),
  ].map(([k, v, p]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${meter(p)}</div>`).join('');

  const q = $('#gq').value.toLowerCase(), f = $('#gf').value;

    ${known.map(v => `<div class="field"><label>${esc(v.label || v.key)}</label><input name="env:${esc(v.key)}" value="${esc(env.get(v.key) ?? '')}" autocomplete="off"></div>`).join('')}
    <div class="field"><label>${known.length ? 'Other environment' : 'Environment'} variables, one KEY=value per line</label>
      <textarea name="extra" spellcheck="false" style="min-height:${Math.min(320, 60 + rest.length * 19)}px" placeholder="TZ=Europe/Copenhagen">${esc(rest.map(([k, val]) => k + '=' + val).join('\n'))}</textarea></div>
    <p>The app reads these when it starts. Some come from the Docker image itself, such as PATH; leave those alone unless you know what they do.</p>
    <h3>Open button</h3>
    <div class="two">
      <div class="field"><label>Web port (0 if the app has no web page)</label><input name="port" type="number" min="0" max="65535" value="${s.web.port}" required></div>
      <div class="field"><label>Path</label><input name="path" value="${esc(s.web.path)}" placeholder="/"></div>
    </div>
    <label class="check"><input type="checkbox" name="https" ${s.web.https ? 'checked' : ''}> The web page only answers on HTTPS</label>
    ${g.status === 'running' ? '<label class="check"><input type="checkbox" name="restart" checked> Restart the app after saving, so changed settings take effect</label>' : ''}`;
}
async function saveApp(g, v) {
  const env = {};
  for (const k in v) if (k.startsWith('env:') && v[k] !== '') env[k.slice(4)] = v[k];
  for (const line of v.extra.split('\n').map(l => l.trim()).filter(Boolean)) {
    const m = /^(\w+)=(.*)$/.exec(line); if (!m) throw new Error(`"${line}" is not in the form KEY=value`);
    env[m[1]] = m[2];
  }
  const r = await api(`guests/lxc/${g.vmid}/app`, { env, web: { port: v.port, path: v.path.trim(), https: 'https' in v } });
  const restart = r.envChanged && 'restart' in v;
  toast(`${g.name}: ${r.envChanged || r.webChanged ? 'settings saved' : 'nothing changed'}${restart ? ', restarting' : r.envChanged ? '. Restart the app to use them' : ''}`);
  await loadManage();
  if (restart) doAction(g, 'reboot'); else refresh();
}

// ---------- store ----------
function renderStore() {
  const cats = [...new Set(catalog.map(a => a.category))].sort();
  const sc = $('#sc'); if (sc.options.length !== cats.length + 1) sc.innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option>${esc(c)}</option>`).join('');
  const q = $('#sq').value.toLowerCase(), c = sc.value;
  const installed = new Set((data ? data.guests : []).map(g => g.app).filter(Boolean));
  $('#apps').innerHTML = catalog.filter(a => (!c || a.category === c) && (!q || (a.name + a.desc + a.category).toLowerCase().includes(q))).map(a => `
    <div class="app click" data-app="${esc(a.id)}" tabindex="0" role="button" aria-label="${esc(a.name)}: details"><div class="row">${icon(a.icon, a.name)}<div class="grow"><div class="name">${esc(a.name)}</div><div class="sub">${esc(a.category)}${installed.has(a.id) ? ' · installed' : ''}</div></div></div>
      <p>${esc(a.desc)}</p>
      <div class="foot"><span class="sub">${a.cores} core${a.cores > 1 ? 's' : ''} · ${a.memory >= 1024 ? a.memory / 1024 + ' GB' : a.memory + ' MB'} · ${a.disk} GB disk</span>
      <button class="btn primary sm" data-install="${esc(a.id)}">Install</button></div></div>`).join('') + (!q && !c || 'custom docker image'.includes(q) ? `
    <div class="app custom"><div class="row"><div class="ico">+</div><div class="grow"><div class="name">Custom image</div><div class="sub">Any Docker / OCI image</div></div></div>
      <p>Run any image from Docker Hub, GHCR or another registry as a container.</p>
      <div class="foot"><span></span><button class="btn sm" data-install="custom">Set up</button></div></div>` : '');
}
$('#sq').oninput = $('#sc').onchange = renderStore;
$('#apps').onclick = e => {
  const b = e.target.closest('[data-install]');
  if (b) return installDialog(b.dataset.install);
  const card = e.target.closest('[data-app]');
  if (card) showApp(card.dataset.app);
};
$('#apps').onkeydown = e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-app]')) { e.preventDefault(); showApp(e.target.dataset.app); }
};
const resources = a => `${a.cores} core${a.cores > 1 ? 's' : ''} · ${a.memory >= 1024 ? a.memory / 1024 + ' GB' : a.memory + ' MB'} memory · ${a.disk} GB disk`;

// Popup with details and screenshots for one store app.
function showApp(id) {
  const a = catalog.find(x => x.id === id); if (!a) return;
  const shots = a.screenshots || [];
  const installed = (data ? data.guests : []).filter(g => g.app === a.id);
  modal(`<div class="row" style="margin-bottom:14px">${icon(a.icon, a.name)}
      <div class="grow"><h2>${esc(a.name)}</h2><div class="sub">${esc(a.category)}${installed.length ? ' · installed as ' + installed.map(g => esc(g.name)).join(', ') : ''}</div></div></div>
    ${shots.length ? `<div id="gallery"><a id="shotLink" href="${esc(shots[0])}" target="_blank" rel="noopener" title="Open full size"><img class="shot" id="shotMain" src="${esc(shots[0])}" alt="Screenshot of ${esc(a.name)}" referrerpolicy="no-referrer"></a>
      ${shots.length > 1 ? `<div class="thumbs">${shots.map((s, i) => `<button type="button" class="thumb ${i ? '' : 'on'}" data-src="${esc(s)}" aria-label="Screenshot ${i + 1}"><img src="${esc(s)}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join('')}</div>` : ''}</div>` : ''}
    <p style="margin-top:14px;color:var(--text)">${esc(a.desc)}</p>
    <dl class="info">
      <dt>Docker image</dt><dd><code>${esc(a.image)}</code></dd>
      <dt>Web page</dt><dd>${a.port ? 'Port ' + a.port + esc(a.path || '') + (a.https ? ' over HTTPS. Your browser will warn about the self-signed certificate the first time' : '') + ', opened with the Open button' : 'None – this app has no web page'}</dd>
      <dt>Default size</dt><dd>${resources(a)}</dd>
      ${(a.env || []).length ? `<dt>Settings</dt><dd>${a.env.map(v => esc(v.label || v.key)).join('<br>')}</dd>` : ''}
      ${a.repo ? `<dt>Source</dt><dd><a href="https://github.com/${esc(a.repo)}" target="_blank" rel="noopener">github.com/${esc(a.repo)}</a></dd>` : ''}
    </dl>
    ${shots.length ? '<div class="sub">Screenshots come from the project\'s own page and may show a newer or older version.</div>' : ''}
    <div class="end"><button class="btn" type="button" data-close>Close</button><button class="btn primary" type="submit" autofocus>Install</button></div>`,
    async () => installDialog(a.id), true, 'wide');
  const g = $('#gallery'); if (!g) return;
  const main = $('#shotMain'), setMain = t => { main.src = $('#shotLink').href = t.dataset.src; g.querySelectorAll('.thumb').forEach(x => x.classList.toggle('on', x === t)); };
  g.querySelectorAll('.thumb').forEach(t => { t.onclick = () => setMain(t); t.querySelector('img').onerror = () => t.remove(); });
  // A screenshot that no longer loads: move on to the next one, or drop the gallery.
  main.onerror = () => { const cur = [...g.querySelectorAll('.thumb')].find(t => t.dataset.src === main.getAttribute('src')); if (cur) cur.remove(); const next = g.querySelector('.thumb'); if (next) setMain(next); else g.remove(); };
}

async function installDialog(id) {
  const custom = id === 'custom';
  const a = custom ? { id: 'custom', name: 'Custom image', cores: 1, memory: 512, disk: 4, env: [] } : catalog.find(x => x.id === id);
  if (!a) return;
  const taken = new Set((data ? data.guests : []).map(g => g.name));
  let host = custom ? '' : a.id; for (let i = 2; taken.has(host); i++) host = `${a.id}-${i}`;
  const o = await api('options').catch(() => ({ storages: [], bridges: [], nextid: '' }));
  const gb = n => n == null ? '' : ` (${(n / 1024 ** 3).toFixed(0)} GB free)`;
  modal(`<h2>Install ${esc(a.name)}</h2><p>${custom ? 'Creates a new container from the image you choose.' : 'One click creates a new container and starts the app. The defaults are fine.'}</p>
    ${custom ? `<div class="field"><label>Image</label><input name="image" placeholder="e.g. ghcr.io/user/app:latest" required autofocus></div>
    <div class="field"><label>Web port (for the Open button)</label><input name="port" type="number" value="80" min="1" max="65535"></div>` : ''}
    <div class="field"><label>Name</label><input name="hostname" value="${esc(host)}" pattern="[a-z0-9]([a-z0-9\\-]*[a-z0-9])?" maxlength="63" required></div>
    <div class="three">
      <div class="field"><label>CPU cores</label><input name="cores" type="number" min="1" max="${data ? data.host.maxcpu : 64}" value="${a.cores}" required></div>
      <div class="field"><label>Memory (MB)</label><input name="memory" type="number" min="64" step="64" value="${a.memory}" required></div>
      <div class="field"><label>Disk (GB)</label><input name="disk" type="number" min="1" value="${a.disk}" required></div>
    </div>
    ${(a.env || []).map(v => `<div class="field"><label>${esc(v.label || v.key)}</label><input name="env:${esc(v.key)}" value="${esc(fill(v.value))}"></div>`).join('')}
    ${(a.env || []).some(v => /\{\{hex/.test(v.value)) ? '<p>Passwords and keys above were generated for you. Note them down before installing.</p>' : ''}
    <details class="adv"><summary>Advanced options</summary>
      ${custom ? '' : `<div class="field"><label>Docker image (change the part after ":" to pin a version)</label><input name="adv:image" value="${esc(a.image)}" required></div>`}
      <div class="two">
        <div class="field"><label>Container ID</label><input name="adv:vmid" type="number" min="100" placeholder="Automatic${o.nextid ? ' (' + esc(o.nextid) + ')' : ''}"></div>
        <div class="field"><label>Swap (MB)</label><input name="adv:swap" type="number" min="0" step="64" value="0"></div>
      </div>
      <div class="two">
        <div class="field"><label>Storage</label><select name="adv:storage">${o.storages.map(s => `<option value="${esc(s.name)}" ${s.name === o.storage ? 'selected' : ''}>${esc(s.name)}${gb(s.free)}</option>`).join('')}</select></div>
        <div class="field"><label>Network bridge</label><select name="adv:bridge">${o.bridges.map(b => `<option ${b === o.bridge ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>IP address</label><select name="adv:net"><option value="dhcp">Automatic (DHCP)</option><option value="static">Static address</option></select></div>
      <div class="two hidden" id="staticNet">
        <div class="field"><label>Address with prefix</label><input name="adv:ip" placeholder="192.168.1.50/24"></div>
        <div class="field"><label>Gateway</label><input name="adv:gw" placeholder="192.168.1.1"></div>
      </div>
      <div class="field"><label>Extra environment variables, one KEY=value per line</label><textarea name="adv:env" spellcheck="false" placeholder="TZ=Europe/Copenhagen"></textarea></div>
      <label class="check"><input type="checkbox" name="adv:onboot" checked> Start automatically when the Proxmox host boots</label>
      <label class="check"><input type="checkbox" name="adv:start" checked> Start the app right after installing</label>
    </details>
    <div class="err"></div>
    <div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Install</button></div>`,
    async v => {
      const env = {}; for (const k in v) if (k.startsWith('env:')) env[k.slice(4)] = v[k];
      for (const line of (v['adv:env'] || '').split('\n').map(l => l.trim()).filter(Boolean)) {
        const m = /^(\w+)=(.*)$/.exec(line); if (!m) throw new Error(`"${line}" is not in the form KEY=value`);
        env[m[1]] = m[2];
      }
      const stat = v['adv:net'] === 'static';
      if (stat && !v['adv:ip']) throw new Error('Enter the static address, for example 192.168.1.50/24');
      const advanced = {
        vmid: v['adv:vmid'], swap: v['adv:swap'], storage: v['adv:storage'], bridge: v['adv:bridge'],
        ip: stat ? v['adv:ip'].trim() : 'dhcp', gw: stat ? (v['adv:gw'] || '').trim() : '',
        onboot: 'adv:onboot' in v, start: 'adv:start' in v,
      };
      if (!custom && v['adv:image'] && v['adv:image'].trim() !== a.image) advanced.image = v['adv:image'].trim();
      await api('install', { appId: a.id, image: v.image, port: v.port, hostname: v.hostname, cores: v.cores, memory: v.memory, disk: v.disk, env, advanced });
      closeModal(); show('activity'); pollJobs();
    });
  const net = $('#modal [name="adv:net"]');
  net.onchange = () => $('#staticNet').classList.toggle('hidden', net.value !== 'static');
  // Open the advanced section if a hidden field in it fails validation, so the browser can show the message.
  $('#modal form').addEventListener('invalid', e => { const d = e.target.closest('details'); if (d) d.open = true; }, true);
}

// ---------- activity ----------
function renderJobs() {
  const active = jobs.filter(j => j.status === 'queued' || j.status === 'running').length;
  $('#jobBadge').textContent = active; $('#jobBadge').classList.toggle('hidden', !active);
  if (tab !== 'activity') return;
  $('#jobs').innerHTML = jobs.map(j => `<div class="job ${esc(j.status)}">
    ${j.status === 'done' ? '<div class="mark" style="color:var(--ok)">✓</div>' : j.status === 'failed' ? '<div class="mark" style="color:var(--bad)">✕</div>' : '<div class="spin"></div>'}
    <div class="grow"><div class="name">${esc(j.appName)} <span class="sub">${esc(j.hostname)}${j.vmid ? ' · container ' + j.vmid : ''}</span></div>
    <div class="st">${esc(j.status === 'failed' ? j.error : j.status === 'done' && j.ip && !j.url ? 'Installed at ' + j.ip : j.step)}</div></div>
    ${j.status === 'done' && j.url ? `<a class="btn sm primary" href="${esc(j.url)}" target="_blank" rel="noopener">Open</a>` : ''}</div>`).join('')
    || '<div class="empty">No installs yet. Pick something from the Store.</div>';
}
let jobTimer, seen = {};
async function pollJobs() {
  clearTimeout(jobTimer);
  try { jobs = await api('jobs'); } catch {}
  for (const j of jobs) {
    if ((j.status === 'done' || j.status === 'failed') && seen[j.id] === 'active') { toast(j.status === 'done' ? `${j.appName} is installed` : `${j.appName} failed to install`); refresh(); }
    seen[j.id] = j.status === 'done' || j.status === 'failed' ? 'final' : 'active';
  }
  renderJobs();
  jobTimer = setTimeout(pollJobs, jobs.some(j => j.status === 'queued' || j.status === 'running') ? 1500 : 15000);
}

// ---------- shortcuts ----------
let shortcuts = null;
async function renderShortcuts() {
  if (!shortcuts) {
    $('#links').innerHTML = '<div class="empty">Loading…</div>';
    try { shortcuts = await api('shortcuts'); } catch (e) { $('#links').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  }
  const q = $('#lq').value.toLowerCase();
  $('#links').innerHTML = shortcuts.filter(s => !q || (s.name + ' ' + s.url + ' ' + s.notes).toLowerCase().includes(q)).map(s => `
    <div class="app"><div class="row">${icon('', s.name)}<div class="grow">
        <a class="name" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a>
        <div class="sub">${esc(s.url.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</div></div></div>
      <p class="notes">${esc(s.notes)}</p>
      <div class="foot"><a class="btn sm primary" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Open</a>
        <span><button class="btn sm" data-edit="${esc(s.id)}">Edit</button> <button class="btn sm danger" data-del="${esc(s.id)}">Delete</button></span></div></div>`).join('')
    || `<div class="empty">${shortcuts.length ? 'Nothing matches.' : 'No shortcuts yet. Add a link you want to keep, with a note about what it is for.'}</div>`;
}
function shortcutDialog(s) {
  modal(`<h2>${s ? 'Edit shortcut' : 'Add shortcut'}</h2>
    <div class="field"><label>Link</label><input name="url" value="${esc(s ? s.url : '')}" placeholder="google.com" maxlength="2000" required autofocus></div>
    <div class="field"><label>Name (optional)</label><input name="name" value="${esc(s ? s.name : '')}" maxlength="80"></div>
    <div class="field"><label>Notes</label><textarea name="notes" maxlength="4000" style="font:inherit;min-height:110px">${esc(s ? s.notes : '')}</textarea></div>
    <div class="err"></div>
    <div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div>`,
    async v => {
      const r = await api('shortcuts', { ...v, id: s ? s.id : undefined });
      if (s) shortcuts[shortcuts.indexOf(s)] = r; else shortcuts.push(r);
      closeModal(); renderShortcuts();
    });
}
$('#lq').oninput = renderShortcuts;
$('#addLink').onclick = () => shortcuts && shortcutDialog();
$('#links').onclick = e => {
  const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
  const s = shortcuts.find(x => x.id === (ed || del || {dataset: {}}).dataset[ed ? 'edit' : 'del']);
  if (!s) return;
  if (ed) return shortcutDialog(s);
  modal(`<h2>Delete ${esc(s.name)}?</h2><p>The link and its notes are removed.</p>
    <div class="end"><button class="btn" type="button" data-close>Cancel</button><button class="btn danger" type="submit" autofocus>Delete</button></div>`,
    async () => { await api(`shortcuts/${s.id}/delete`, {}); shortcuts = shortcuts.filter(x => x !== s); closeModal(); renderShortcuts(); });
};

// ---------- update button ----------
// Shown in the top bar only while GitHub has a newer version than the one running.
let upd = null;
const changeList = r => `<ul>${(r.changes || []).map(c => `<li><span class="kind ${esc(c.type)}">${esc({ new: 'New', improved: 'Improved', fixed: 'Fixed' }[c.type] || c.type)}</span><span>${esc(c.text)}</span></li>`).join('')}</ul>`;
async function checkUpdate() {
  try { upd = await api('update'); } catch { return; }
  $('#updateBtn').classList.toggle('hidden', !upd.available);
}
$('#updateBtn').onclick = () => {
  const how = {
    button: '<p>Updating takes a few seconds. You may have to sign in again afterwards.</p>',
    auto: '<p>Automatic updates are on, so this version installs itself within about a minute. Reload the page after that.</p>',
    manual: `<p>To install it, open the App Store container's console in Proxmox and run:</p><pre>cd /opt/appstore && git pull && systemctl restart appstore</pre>
      <p>The README's Updating section shows how to let this button install updates for you.</p>`,
  }[upd.mode];
  modal(`<h2>Update available</h2><p>A newer version of the App Store is on GitHub.</p>
    ${(upd.releases || []).map(r => `<div class="rel"><h3>Version ${esc(r.version)}</h3>${changeList(r)}</div>`).join('')}
    ${how}<div class="err"></div>
    <div class="end"><button class="btn" type="button" data-close>Close</button>${upd.mode === 'button' ? '<button class="btn primary" type="submit" autofocus>Update now</button>' : ''}</div>`,
    async (v, f) => {
      await api('update', {});
      f.querySelector('[type=submit]').textContent = 'Updating…';
      // The server restarts on the new version. A lost session reloads the page by itself (see api()).
      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 2000));
        try { if ((await api('update')).running !== upd.running) return location.reload(); } catch {}
      }
      f.querySelector('[type=submit]').textContent = 'Update now';
      throw new Error('The update has not finished. In the container, run: journalctl -u appstore-update -n 20');
    });
};

// ---------- shell ----------
// ---------- changelog ----------
let releases = null;
async function renderChangelog() {
  if (!releases) {
    $('#releases').innerHTML = '<div class="empty">Loading…</div>';
    try { releases = await api('changelog'); } catch (e) { $('#releases').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  }
  const day = d => { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? d : t.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); };
  $('#releases').innerHTML = releases.map((r, i) => `<article class="rel">
    <div class="relhead"><h2>Version ${esc(r.version)}</h2>${i ? '' : '<span class="tag latest">Latest</span>'}<span class="sub">${esc(day(r.date))}</span></div>
    ${changeList(r)}
  </article>`).join('') || '<div class="empty">No changes recorded yet.</div>';
}

function show(t) {
  // Leaving the Manage page drops what is open in the file editor.
  if (tab === 'manage' && t !== 'manage' && mg && mg.files.edit && mg.files.edit.dirty && !confirm('Leave without saving your changes to the file?')) return;
  tab = t;
  for (const s of ['overview', 'manage', 'store', 'shortcuts', 'activity', 'changelog']) $('#' + s).classList.toggle('hidden', s !== t);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === (t === 'manage' ? 'overview' : t)));
  ({ overview: renderOverview, manage: renderManage, store: renderStore, shortcuts: renderShortcuts, activity: renderJobs, changelog: renderChangelog })[t]();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
$('#logout').onclick = async () => { await api('logout', {}); location.reload(); };

(async () => {
  state = await api('state');
  if (!state.configured) return showSetup();
  if (!state.authed) return showLogin();
  $('#hdr').classList.remove('hidden');
  catalog = await api('catalog');
  show('overview');
  await refresh(); pollJobs();
  checkUpdate(); setInterval(checkUpdate, 15 * 60 * 1000);
  setInterval(() => { if (!document.hidden) refresh(); }, 5000);
})().catch(e => toast(e.message));
</script>
